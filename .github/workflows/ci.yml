name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend test dependencies
        run: npm ci

      - name: Audit locked dependencies
        run: |
          npm run audit:dependencies
          python -m pip_audit -r requirements-dev.txt
          python -m pip_audit -r requirements-macos.txt
          python -m pip_audit -r requirements-macos-mlx.txt
          python -m pip_audit -r requirements-macos-unlimited-ocr.txt
          python -m pip_audit -r requirements-macos-ovisocr2.txt

      - name: Run local quality gate
        run: PYTHON_BIN=python bash scripts/check-local.sh

      - name: Check test coverage
        run: PYTHON_BIN=python bash scripts/check-coverage.sh
