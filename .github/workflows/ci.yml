name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install frontend test dependencies
        run: npm ci

      - name: Audit locked dependencies
        if: runner.os == 'Linux'
        run: |
          npm run audit:dependencies
          npm audit signatures
          python -m pip_audit --strict -r requirements-dev.txt
          python -m pip_audit --strict -r requirements-macos.txt
          python -m pip_audit --strict -r requirements-macos-mlx.txt
          python -m pip_audit --strict -r requirements-macos-unlimited-ocr.txt
          python -m pip_audit --strict -r requirements-macos-ovisocr2.txt
          python -m pip_audit --strict -r requirements-macos-hpd-parsing.txt

      - name: Run local quality gate
        run: PYTHON_BIN=python bash scripts/check-local.sh

      - name: Check test coverage
        run: PYTHON_BIN=python bash scripts/check-coverage.sh

  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install smoke client
        run: python -m pip install -r requirements.txt
      - name: Start clean CPU deployment
        run: docker compose -f docker-compose.cpu.yml up -d --build --wait --wait-timeout 1200
      - name: Recognize generated image and two-page PDF
        run: python scripts/smoke-cpu.py
      - name: Deployment logs
        if: always()
        run: docker compose -f docker-compose.cpu.yml logs --tail 100
      - name: Stop smoke deployment
        if: always()
        run: docker compose -f docker-compose.cpu.yml down
